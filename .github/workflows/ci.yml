name: CI

on:
  push:
    branches:
      - main

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Rust formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all --check

  rust:
    name: Rust ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: Swatinem/rust-cache@v2

      # The plugin tests include cross-platform model/serialization/diff tests
      # plus platform-specific suites (sysfs fixtures on Linux, mapping tests
      # on Windows/macOS).
      - name: Tests
        run: cargo test --all-targets

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings

  msrv:
    name: Rust MSRV 1.88
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.88

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check

      - name: Test MSRV
        run: cargo test

  guest-js:
    name: Guest JS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - run: pnpm install

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Package audit
        run: npm pack --dry-run

      # api-iife.js and dist-js are committed artifacts.
      # Fail if the build would change them.
      - name: Generated files are up to date
        run: git diff --exit-code -- api-iife.js dist-js